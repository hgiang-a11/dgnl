# Thiết lập cho toàn dự án
# Cấp thêm bộ nhớ cho tiến trình build (giúp build nhanh, tránh thiếu bộ nhớ)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build song song và dùng bộ nhớ đệm để nhanh hơn
org.gradle.parallel=true
org.gradle.caching=true

# Bắt buộc với thư viện AndroidX (bộ thư viện chính thức hiện đại của Android)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Dùng Kotlin style chính thức
kotlin.code.style=official
