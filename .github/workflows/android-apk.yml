name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SapToiNoi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SapToiNoi-apk
          path: android/SapToiNoi.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Sắp Tới Nơi – bản ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: android/SapToiNoi.apk
          body: |
            Tải file **SapToiNoi.apk** bên dưới về điện thoại Android rồi mở ra để cài.

            Nếu máy hỏi, hãy cho phép "Cài ứng dụng từ nguồn không xác định".
