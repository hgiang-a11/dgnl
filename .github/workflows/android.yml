name: Build TaskFlow APK

on:
  push:
    paths:
      - 'todo-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Chuan bi Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ban debug va ban release
        working-directory: todo-app
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Doi ten file APK
        working-directory: todo-app
        run: |
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/TaskFlow-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/TaskFlow-debug.apk
          ls -la ../artifacts

      - name: Tai APK len Actions
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Dua APK len muc Releases de tai truc tiep
        if: github.ref == 'refs/heads/claude/android-todo-list-app-jcqt33' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="taskflow-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/TaskFlow-release.apk artifacts/TaskFlow-debug.apk --clobber
          else
            gh release create "$TAG" artifacts/TaskFlow-release.apk artifacts/TaskFlow-debug.apk \
              --title "TaskFlow - ban moi nhat" \
              --notes "App to-do list 3 cot keo tha. Tai file TaskFlow-release.apk va cai len dien thoai Android (can bat Cai dat tu nguon khong xac dinh)."
          fi
