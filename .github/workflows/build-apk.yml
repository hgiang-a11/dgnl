# Tự động build file APK của app CodeLab trên máy chủ GitHub.
# Chạy mỗi khi có thay đổi trong thư mục CodeLab, hoặc bấm tay ở tab "Actions".
# Quy trình: build -> cài thử và chạy kiểm thử trên máy ảo Android -> đăng APK lên Releases.
# APK chỉ được đăng khi cài thử và kiểm thử đều đạt.
name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "CodeLab/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

# Cần quyền ghi để đăng APK lên trang Releases
permissions:
  contents: write

# Nếu đẩy code liên tục, chỉ giữ lần build mới nhất
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodeLab

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy cần Python cùng phiên bản với app (3.11) trên máy build
      - name: Cài Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài Gradle (có bộ nhớ đệm cho lần sau nhanh hơn)
        uses: gradle/actions/setup-gradle@v4

      # Chỉ đọc danh sách trình dịch của Wandbox (không gửi code) để xem các trình dịch
      # app sẽ chọn có tồn tại không. Không làm hỏng build nếu Wandbox tạm thời không truy cập được.
      - name: Xem danh sách trình dịch trên Wandbox
        continue-on-error: true
        run: |
          curl -sS --max-time 30 https://wandbox.org/api/list.json | python3 -c "
          import sys, json
          L = json.load(sys.stdin)
          names = {c['name'] for c in L}
          for lang in ('C++', 'C', 'Java'):
              print(lang, '->', sorted(c['name'] for c in L if c.get('language') == lang)[:15])
          for n in ('gcc-head', 'gcc-head-c'):
              print(n, ':', 'CO' if n in names else 'KHONG CO')
          "

      - name: Build APK bản phát hành
        run: ./gradlew assembleRelease --stacktrace

      - name: Đặt tên file APK
        run: cp app/build/outputs/apk/release/app-release.apk CodeLab.apk

      - name: Kiểm tra chữ ký và căn lề APK
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose CodeLab.apk | head -6
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c 4 CodeLab.apk && echo "Căn lề zip: OK"

      - name: Lưu APK vào mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeLab-APK
          path: CodeLab/CodeLab.apk

  test:
    name: Cài thử và kiểm thử trên máy ảo Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: CodeLab

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lấy file APK vừa build
        uses: actions/download-artifact@v4
        with:
          name: CodeLab-APK
          path: CodeLab/dist

      - name: Bật tăng tốc phần cứng cho máy ảo (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 1) Chạy các bài kiểm thử (Python, JavaScript, mở app) trên máy ảo Android 14
      # 2) Cài đúng file APK sẽ đăng lên Releases, mở app và kiểm tra app không bị sập
      - name: Chạy trên máy ảo Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: CodeLab
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb install -r dist/CodeLab.apk
            adb shell am start -W -n com.codelab.app/.MainActivity
            sleep 10
            adb logcat -d -b crash
            adb shell pidof com.codelab.app

  release:
    name: Đăng APK lên Releases
    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Lấy file APK đã kiểm thử
        uses: actions/download-artifact@v4
        with:
          name: CodeLab-APK
          path: dist

      - name: Viết nội dung trang tải
        run: |
          cat > notes.md <<'EOF'
          ## 📱 Tải app CodeLab cho Android

          ### 👉 [BẤM VÀO ĐÂY ĐỂ TẢI CodeLab.apk](https://github.com/${{ github.repository }}/releases/download/apk-moi-nhat/CodeLab.apk)

          Hoặc kéo xuống mục **Assets** ở cuối trang và bấm vào **CodeLab.apk**.

          ### Cách cài đặt
          1. Bấm link ở trên, chờ tải xong file **CodeLab.apk**.
          2. Mở file vừa tải (bấm vào thông báo tải xuống, hoặc mở trong ứng dụng Tệp/File).
          3. Nếu điện thoại hỏi, bấm **Cài đặt** → bật **Cho phép từ nguồn này**, rồi quay lại bấm **Cài đặt**.
          4. Nếu Google Play Protect cảnh báo, chọn **Chi tiết khác** → **Vẫn cài đặt**.

          > 💡 Nên mở trang này bằng trình duyệt **Chrome** (không mở bên trong ứng dụng GitHub hay ứng dụng chat) để tải file dễ hơn.

          ---
          Bản build tự động từ nhánh `${{ github.ref_name }}` (commit `${{ github.sha }}`), đã cài thử và kiểm thử trên máy ảo Android 14.
          EOF

      - name: Đăng APK lên trang Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Xóa bản cũ (nếu có) rồi đăng bản mới, để link tải luôn trỏ tới bản mới nhất.
          # Đánh dấu "Latest" để hiện ngay ở mục Releases trên trang chính của kho mã.
          gh release delete apk-moi-nhat --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create apk-moi-nhat dist/CodeLab.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "📱 CodeLab - Tải APK (bản mới nhất)" \
            --notes-file notes.md
